<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장 수리국</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f2e9;
    color: #203d35;
    font-family: system-ui, sans-serif;
  }
  header {
    background: #205c47;
    color: white;
    padding: 22px;
  }
  .header-inner, main { max-width: 900px; margin: auto; }
  .header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
  }
  h1 { margin: 0; font-size: 25px; }
  main { padding: 24px 16px; }
  p, li { line-height: 1.8; }
  nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
  button, textarea { font: inherit; }
  button {
    border: 0;
    border-radius: 10px;
    padding: 12px 17px;
    cursor: pointer;
    background: #205c47;
    color: white;
    margin: 4px 4px 4px 0;
  }
  button:hover { filter: brightness(1.12); }
  button:focus-visible, textarea:focus-visible {
    outline: 3px solid #d89721;
    outline-offset: 3px;
  }
  button:disabled { opacity: .4; cursor: default; }
  nav button { white-space: nowrap; background: #e0e6d8; color: #203d35; }
  nav button.active { background: #205c47; color: white; }
  .card {
    background: white;
    border: 1px solid #d9dfd2;
    border-radius: 20px;
    padding: 26px;
  }
  .tag {
    display: inline-block;
    padding: 6px 12px;
    background: #e9f1d6;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
  }
  .sentence {
    padding: 22px;
    background: #f3f5ed;
    border-left: 5px solid #205c47;
    font-size: 22px;
    line-height: 1.7;
    margin: 20px 0;
    white-space: pre-wrap;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: #eef2e7;
    color: #203d35;
    padding: 16px;
    margin: 10px 0;
  }
  .secondary { background: #e8eddf; color: #203d35; }
  .tile { background: #dced9a; color: #203d35; border-bottom: 3px solid #aac16c; }
  .slot {
    min-height: 75px;
    border: 2px dashed #a6b79c;
    border-radius: 12px;
    padding: 18px;
    font-size: 21px;
    margin: 18px 0;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    padding: 15px;
    border: 1px solid #a8b69f;
    border-radius: 12px;
    color: #203d35;
    background: #fcfdf8;
    resize: vertical;
  }
  label { display: block; margin: 12px 0; line-height: 1.7; }
  input[type="checkbox"] { accent-color: #205c47; margin-right: 8px; }
  .feedback {
    background: #edf5d6;
    padding: 16px;
    border-radius: 12px;
    margin: 16px 0;
    line-height: 1.8;
  }
  .error { background: #fff0d8; }
  details { margin: 20px 0; }
  summary { cursor: pointer; font-weight: bold; }
  .muted { color: #667466; font-size: 13px; }
  progress { width: 100%; height: 12px; margin: 12px 0 20px; accent-color: #205c47; }
  #toast { min-height: 26px; font-weight: bold; }
  @media (max-width: 600px) {
    .card { padding: 20px; }
    h1 { font-size: 21px; }
    .sentence { font-size: 19px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>🛠️ 문장 수리국</h1>
    <strong id="score">0 / 160 XP</strong>
  </div>
</header>

<main>
  <p><b>중3 문장 수리 요원 모집!</b><br>
    오류를 찾고, 문장을 조립하고, 나만의 문장을 만들어 보세요.
  </p>
  <nav id="nav" aria-label="게임 단계"></nav>
  <progress id="progress" max="8" value="0" aria-label="완료 미션"></progress>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="app" class="card"></section>
  <p class="muted">
    작성 내용은 이 브라우저에 저장됩니다.
    자유 문장은 체크리스트와 짝 피드백으로 검토합니다.
  </p>
</main>

<script>
const $ = selector => document.querySelector(selector);
const STORAGE_KEY = "sentence-repair-game-v1";

let stored = {};
try {
  stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch {}

const state = {
  step: Number.isInteger(stored.step) &&
        stored.step >= 0 && stored.step <= 5 ? stored.step : 0,
  done: Array.isArray(stored.done) ? stored.done : [],
  answers: stored.answers && typeof stored.answers === "object"
    ? stored.answers : {}
};

let selectedTiles = [];
let toastTimer;

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {}
}

function save(key, value) {
  state.answers[key] = value;
  persist();
}

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[char]));
}

function notify(message) {
  $("#toast").textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").textContent = "", 5000);
}

function updateScore() {
  $("#score").textContent = `${state.done.length * 20} / 160 XP`;
  $("#progress").value = state.done.length;
}

function award(id) {
  if (!state.done.includes(id)) {
    state.done.push(id);
    persist();
    notify("✨ 미션 완료! +20 XP");
  }
  updateScore();
}

function go(step) {
  state.step = step;
  persist();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function textField(key, label, placeholder = "") {
  return `
    <label for="${key}"><b>${label}</b></label>
    <textarea id="${key}"
      placeholder="${escapeHTML(placeholder)}"
      oninput="save('${key}', this.value)"
    >${escapeHTML(state.answers[key] || "")}</textarea>
  `;
}

function checklist(prefix, items) {
  return `<h3>✅ 자기 점검</h3>` + items.map((item, index) => `
    <label>
      <input type="checkbox"
        ${state.answers[prefix + index] ? "checked" : ""}
        onchange="save('${prefix + index}', this.checked)">
      ${item}
    </label>
  `).join("");
}

function checked(prefix, count) {
  return Array.from({ length: count }, (_, i) =>
    state.answers[prefix + i] === true
  ).every(Boolean);
}

function hasText(key) {
  return typeof state.answers[key] === "string" &&
    state.answers[key].trim().length > 0;
}

function message(target, text, error = false) {
  $(target).innerHTML =
    `<div class="feedback ${error ? "error" : ""}">${text}</div>`;
}

const stages = [
  "① 오류 탐정", "② 수리 설명서", "③ 문장 조립",
  "④ 문장 연결", "⑤ 문장 창작", "⑥ 짝 피드백"
];

function render() {
  $("#nav").innerHTML = stages.map((name, index) => `
    <button class="${index === state.step ? "active" : ""}"
      ${index === state.step ? 'aria-current="step"' : ""}
      onclick="go(${index})">${name}</button>
  `).join("");

  updateScore();
  [renderDetective, renderGuide, renderTiles,
   renderConnect, renderWrite, renderPeer][state.step]();
}

/* 1. 도입: 오류 탐정 */
const cases = [
  {
    sentence: "내 꿈은 멋진 요리사가 되고 싶다.",
    options: [
      "주어와 서술어가 호응하지 않는다.",
      "목적어가 두 개라서 틀렸다.",
      "부사어가 없어서 틀렸다."
    ],
    correct: 0,
    explanation:
      "‘내 꿈은’에는 ‘~이 되는 것이다’가 어울려요.<br>" +
      "수정 예시: <b>내 꿈은 멋진 요리사가 되는 것이다.</b><br>" +
      "또는 <b>나는 멋진 요리사가 되고 싶다.</b>"
  },
  {
    sentence: "나는 급식실에서 먹었다 점심을.",
    options: [
      "주어가 없다.",
      "일반적인 글에서 목적어의 배치가 어색하다.",
      "서술어가 없다."
    ],
    correct: 1,
    explanation:
      "수정 예시: <b>나는 급식실에서 점심을 먹었다.</b><br>" +
      "일반적인 글에서는 목적어를 서술어 앞에 두면 자연스러워요. " +
      "한국어의 어순은 비교적 자유롭고, 말할 때 뒤에 덧붙이는 표현도 가능해요."
  },
  {
    sentence: "나는 친구와 동생을 만났다.",
    options: [
      "서술어가 두 개다.",
      "목적어가 반드시 문장 맨 앞에 와야 한다.",
      "누구와 누구를 만났는지 두 가지로 읽힐 수 있다."
    ],
    correct: 2,
    explanation:
      "① <b>나는 친구와 함께 동생을 만났다.</b><br>" +
      "② <b>나는 친구와 동생을 각각 만났다.</b><br>" +
      "문법에 맞아도 뜻이 모호할 수 있어요. 의도한 뜻을 분명히 밝혀요."
  }
];

let caseIndex = 0;

function renderDetective() {
  const item = cases[caseIndex];
  $("#app").innerHTML = `
    <span class="tag">도입 · 분석 · ${caseIndex + 1} / 3</span>
    <h2>🔎 어디가 수상할까?</h2>
    <p>먼저 고친 문장을 생각해 보고, 문제점을 선택하세요.</p>
    <div class="sentence">${item.sentence}</div>
    ${item.options.map((option, i) => `
      <button class="choice" onclick="answerCase(${i})">
        ${String.fromCharCode(65 + i)}. ${option}
      </button>
    `).join("")}
    <div id="case-result" role="status"></div>
    <details>
      <summary>게임 규칙과 학습 목표</summary>
      <p>
        주어·서술어·목적어·부사어를 구별하고 정확하고 자연스러운 문장을 만듭니다.
        분석 → 적용 → 종합·창작 순서로 도전해요.
      </p>
      <p>
        미션마다 20 XP! 오답 감점과 시간 제한은 없습니다.
        자유 문장은 정답 하나로 채점하지 않습니다.
        8개 미션을 완료하면 문장 수리 마스터!
      </p>
      <p>
        45분 수업: 오류 탐정 7분 → 설명서 5분 → 조립 6분 →
        연결 6분 → 창작 13분 → 짝 피드백 8분.
      </p>
    </details>
    <button class="secondary" onclick="go(1)">설명서 먼저 보기 →</button>
  `;
}

function answerCase(index) {
  const item = cases[caseIndex];

  if (index !== item.correct) {
    message("#case-result",
      "다시 살펴봐요! 주어와 서술어, 말의 위치, 문장의 뜻을 차례로 확인하세요.",
      true);
    return;
  }

  award("case" + caseIndex);
  $("#case-result").innerHTML = `
    <div class="feedback"><b>단서 발견!</b><br>${item.explanation}</div>
    <button onclick="nextCase()">
      ${caseIndex < 2 ? "다음 사건 →" : "수리 설명서로 →"}
    </button>
  `;
}

function nextCase() {
  if (caseIndex < 2) {
    caseIndex++;
    renderDetective();
  } else {
    go(1);
  }
}

/* 2. 문장 구조 원칙 */
function renderGuide() {
  $("#app").innerHTML = `
    <span class="tag">이해 · 수리 도구</span>
    <h2>📘 문장을 고치는 다섯 가지 도구</h2>
    <div class="sentence">민지가 도서관에서 재미있는 책을 읽는다.</div>
    <ul>
      <li><b>주어:</b> 민지가 — 누가?</li>
      <li><b>서술어:</b> 읽는다 — 어찌한다?</li>
      <li><b>목적어:</b> 책을 — 무엇을?</li>
      <li><b>부사어:</b> 도서관에서 — 어디에서?</li>
      <li><b>관형어:</b> 재미있는 — 어떤 책?</li>
    </ul>
    <h3>1. 주어와 서술어는 짝꿍</h3>
    <p>“내 목표는 매일 운동하는 것이다.”처럼 의미가 호응해야 해요.</p>
    <h3>2. 기본 어순을 출발점으로</h3>
    <p>
      <b>주어 + (부사어) + 목적어 + 서술어</b><br>
      나는 오늘 책을 읽었다.<br>
      한국어는 조사 덕분에 어순이 비교적 자유로워요.
      맥락과 강조에 따라 바꿀 수 있지만 읽는 사람이 이해하기 쉽게 배치해요.
    </p>
    <h3>3. 꾸미는 말은 대상 가까이에</h3>
    <p>
      “나는 어제 산 책을 읽었다.”에서 ‘어제 산’은 ‘책’을 꾸며요.<br>
      어제 읽었다는 뜻이라면 “나는 그 책을 어제 읽었다.”라고 써요.
    </p>
    <h3>4. 뜻은 분명하게</h3>
    <p>두 가지 뜻으로 읽히면 말을 보충하거나 구조를 바꿔요.</p>
    <h3>5. 겹치는 말은 간결하게</h3>
    <p>“미리 사전에 준비했다.” → “미리 준비했다.”</p>
    <p class="feedback">
      모든 문장에 목적어가 필요한 것은 아니에요.
      “꽃이 피었다.”, “나는 학생이다.”도 완전한 문장이에요.
    </p>
    <button onclick="award('guide'); go(2)">도구 챙기기 · +20 XP →</button>
  `;
}

/* 3. 기초: 카드 조립 */
const tileWords = ["읽었다.", "도서관에서", "나는", "만화책을"];

function renderTiles() {
  selectedTiles = [];

  $("#app").innerHTML = `
    <span class="tag">연습 1 · 기초 · 홑문장</span>
    <h2>🧩 흩어진 문장을 조립하라</h2>
    <p>‘누가 → 어디에서 → 무엇을 → 어찌했다’ 순서로 카드를 누르세요.</p>
    <div id="slot" class="slot" aria-live="polite">문장을 조립해 주세요.</div>
    ${tileWords.map((word, i) => `
      <button id="tile-${i}" class="tile" onclick="pickTile(${i})">${word}</button>
    `).join("")}
    <p>
      <button class="secondary" onclick="renderTiles()">다시 조립</button>
      <button onclick="checkTiles()">구조 확인</button>
    </p>
    <div id="tile-result" role="status"></div>
    ${checklist("tile-check", [
      "주어 ‘나는’과 서술어 ‘읽었다’가 호응하는가?",
      "‘만화책을’은 목적어, ‘도서관에서’는 부사어임을 확인했는가?",
      "소리 내어 읽었을 때 자연스러운가?"
    ])}
    <details>
      <summary>🛟 도움 카드</summary>
      <p>
        한국어의 기본 틀: <b>주어 + 목적어 + 서술어</b><br>
        [나는] + [간식을] + [먹었다].<br>
        부사어 더하기: [나는] + [쉬는 시간에] + [간식을] + [먹었다].
      </p>
    </details>
    <button onclick="finishTiles()">점검 완료 · 다음 미션 →</button>
  `;
}

function pickTile(index) {
  if (selectedTiles.includes(index)) return;
  selectedTiles.push(index);
  $("#tile-" + index).disabled = true;
  $("#slot").textContent = selectedTiles.map(i => tileWords[i]).join(" ");
}

function tilesCorrect() {
  return selectedTiles.join(",") === "2,1,3,0";
}

function checkTiles() {
  message("#tile-result", tilesCorrect()
    ? "조립 성공! 나는(주어) / 도서관에서(부사어) / 만화책을(목적어) / 읽었다(서술어)."
    : "이번 미션의 순서는 ‘누가 → 어디에서 → 무엇을 → 어찌했다’예요. 다른 맥락에서는 다른 어순도 가능해요.",
    !tilesCorrect());
}

function finishTiles() {
  if (!tilesCorrect()) {
    checkTiles();
    return;
  }
  if (!checked("tile-check", 3)) {
    notify("체크리스트의 세 항목을 모두 확인해 주세요.");
    return;
  }
  award("tiles");
  go(3);
}

/* 4. 중급: 문장 연결 */
function renderConnect() {
  $("#app").innerHTML = `
    <span class="tag">연습 2 · 중급 · 겹문장</span>
    <h2>🌉 두 문장 사이에 다리를 놓아라</h2>
    <div class="sentence">비가 왔다. 우리는 실내에서 농구를 했다.</div>
    <p><b>원인과 결과</b>가 드러나도록 한 문장으로 연결하세요.</p>
    ${textField("connect", "내가 연결한 문장", "비가 와서 …")}
    <details>
      <summary>💡 힌트와 예시</summary>
      <p>
        ‘-아서/어서’, ‘-기 때문에’를 활용해 보세요.<br>
        예: “비가 와서 우리는 실내에서 농구를 했다.”<br>
        ‘비가 왔지만’은 대조를 나타내므로 이번 조건과 달라요.
      </p>
    </details>
    ${checklist("connect-check", [
      "각 절의 주어와 서술어가 호응하는가?",
      "연결 표현이 원인과 결과를 나타내는가?",
      "부사어의 위치가 자연스럽고 불필요한 반복이 없는가?"
    ])}
    <div id="connect-result" role="status"></div>
    <button onclick="finishConnect()">점검 완료 · 다음 미션 →</button>
  `;
}

function finishConnect() {
  if (!hasText("connect") || !checked("connect-check", 3)) {
    message("#connect-result", "문장을 쓰고 체크리스트를 모두 확인해 주세요.", true);
    return;
  }
  award("connect");
  go(4);
}

/* 5. 심화: 의미 구별 + 창작 */
function renderWrite() {
  $("#app").innerHTML = `
    <span class="tag">연습 3·4 · 심화 · 종합·창작</span>
    <h2>✍️ 작가의 작업실</h2>

    <h3>연습 3. 두 가지 뜻을 분리하라</h3>
    <div class="sentence">나는 친구와 동생을 만났다.</div>
    <p>
      ① 친구와 함께 동생을 만났다는 뜻<br>
      ② 친구와 동생을 각각 만났다는 뜻<br>
      두 뜻을 분명하게 구별하는 문장을 각각 쓰세요.
    </p>
    ${textField("meaning", "두 가지 수정 문장", "① …\n② …")}
    <details>
      <summary>💡 수정 예시</summary>
      <p>
        ① 나는 친구와 함께 동생을 만났다.<br>
        ② 나는 친구를 만났고, 동생도 만났다.
      </p>
    </details>
    ${checklist("meaning-check", [
      "두 문장을 모두 썼고 각각의 뜻이 분명한가?",
      "필요한 말을 보충하거나 문장 구조를 바꾸었는가?",
      "주어와 서술어가 호응하고 군더더기가 없는가?"
    ])}
    <button class="secondary" onclick="finishMeaning()">연습 3 완료 · +20 XP</button>
    <div id="meaning-result" role="status"></div>

    <hr>
    <h3>연습 4. 일상을 한 문장으로</h3>
    <p>
      <b>급식·동아리·친구·주말</b> 중 하나를 골라
      두 절 이상으로 된 새 문장을 쓰세요.
      시간·장소·방법을 나타내는 <b>부사어</b>도 하나 이상 넣으세요.
    </p>
    ${textField("creative", "나의 창작 문장", "내가 전하고 싶은 이야기는…")}
    <details>
      <summary>🛟 기본 도움 틀</summary>
      <p>
        [나는] [점심시간에] [친구를] [만났고],
        [우리는] [운동장에] [갔다].
      </p>
    </details>
    <details>
      <summary>🔥 고급 도전 카드</summary>
      <p>
        ‘그래서·그러나’로 두 문장의 관계를 생각한 뒤,
        ‘-아서/어서·-지만’을 이용해 한 문장으로 연결하세요.
        ‘어제 빌린’, ‘친구가 추천한’ 같은 관형절도 넣어 보세요.
      </p>
      <p>
        예: “나는 주말에 친구가 추천한 책을 읽었지만,
        결말은 예상하지 못했다.”
      </p>
      <p>
        한국어에서 ‘그래서·그러나’는 보통 접속 부사라고 부릅니다.
        한 문장 안에서 절을 연결할 때는 연결 어미를 활용할 수 있어요.
      </p>
    </details>
    ${checklist("creative-check", [
      "두 절 이상이며 각 절의 주어와 서술어가 호응하는가?",
      "부사어를 넣고 수식어를 알맞게 배치했는가?",
      "뜻이 분명하고 자연스러우며 불필요한 말이 없는가?"
    ])}
    <div id="creative-result" role="status"></div>
    <button onclick="finishCreative()">창작 완료 · 짝에게 보여 주기 →</button>
  `;
}

function finishMeaning() {
  if (!hasText("meaning") || !checked("meaning-check", 3)) {
    message("#meaning-result",
      "두 가지 뜻의 문장을 쓰고 체크리스트를 모두 확인해 주세요.", true);
    return;
  }
  award("meaning");
  message("#meaning-result", "연습 3 완료! 짝이 두 뜻을 구별할 수 있는지 확인해 보세요.");
}

function finishCreative() {
  if (!state.done.includes("meaning")) {
    message("#creative-result", "먼저 연습 3을 완료해 주세요.", true);
    return;
  }
  if (!hasText("creative") || !checked("creative-check", 3)) {
    message("#creative-result",
      "창작 문장을 쓰고 체크리스트를 모두 확인해 주세요.", true);
    return;
  }
  award("creative");
  go(5);
}

/* 6. 짝 피드백 */
function renderPeer() {
  $("#app").innerHTML = `
    <span class="tag">마무리 · 공유와 수정</span>
    <h2>🤝 짝꿍 편집 회의</h2>
    <p>
      짝과 화면을 바꿔 읽거나 문장을 소리 내어 읽으세요.
      한 명은 작가, 한 명은 편집자가 되어 의견을 나눈 뒤 역할을 바꿉니다.
    </p>
    <div class="sentence">${escapeHTML(
      state.answers.creative || "작가의 작업실에서 문장을 먼저 만들어 주세요."
    )}</div>

    ${textField("praise",
      "짝의 피드백 ① 자연스러운 점",
      "‘…’라는 표현은 …해서 자연스러워.")}
    ${textField("suggest",
      "짝의 피드백 ② 개선 제안",
      "‘…’를 ‘…’로 바꾸면 뜻이 더 분명해질 것 같아.\n개선할 곳이 없다면 그 이유를 써 주세요.")}
    ${textField("final", "피드백을 반영한 최종 문장")}
    ${textField("reason", "수정 이유 또는 유지한 이유",
      "나는 …를 바꾸었다. 왜냐하면 …")}

    ${checklist("peer-check", [
      "짝과 문장을 공유하고 이유를 담아 피드백했는가?",
      "최종 문장의 호응·배치·명료성·자연스러움을 확인했는가?"
    ])}
    <button onclick="finishGame()">🏅 배지 받기</button>
    <button class="secondary" onclick="downloadRecord()">활동 기록 내려받기</button>
    <div id="finish-result" role="status"></div>

    <details>
      <summary>교사용 안내</summary>
      <p>
        자유 문장은 자동으로 문법 판정을 하지 않습니다.
        성분 구별, 호응, 명료성, 자연스러움, 수정 이유를 중심으로
        학생의 자기 점검과 교사의 피드백을 함께 활용하세요.
      </p>
      <p>
        같은 기기에서 화면을 보여 주는 짝 활동입니다.
        여러 기기 사이의 실시간 공유 기능은 없습니다.
      </p>
    </details>
    <button class="secondary" onclick="resetGame()">처음부터 다시 하기</button>
  `;
}

function finishGame() {
  if (!["praise", "suggest", "final", "reason"].every(hasText)
      || !checked("peer-check", 2)) {
    message("#finish-result",
      "피드백, 최종 문장, 수정 이유를 쓰고 체크리스트를 확인해 주세요.", true);
    return;
  }

  award("peer");
  const complete = state.done.length === 8;
  message("#finish-result", `
    <h2>${complete ? "🏆 문장 수리 마스터!" : "🌟 문장 수리 요원!"}</h2>
    <b>${state.done.length * 20} XP 획득</b><br>
    ${complete
      ? "분석부터 창작과 수정까지 모든 미션을 해냈어요!"
      : "아직 완료하지 않은 미션에도 도전해 160 XP를 모아 보세요."}
  `);
}

function downloadRecord() {
  const fields = [
    ["연결한 문장", "connect"],
    ["두 가지 뜻의 문장", "meaning"],
    ["창작 문장", "creative"],
    ["자연스러운 점", "praise"],
    ["개선 제안", "suggest"],
    ["최종 문장", "final"],
    ["수정 이유", "reason"]
  ];

  const text = "문장 수리국 활동 기록\n" +
    `획득 점수: ${state.done.length * 20} XP\n\n` +
    fields.map(([title, key]) =>
      title + "\n" + (state.answers[key] || "(미작성)")
    ).join("\n\n");

  const url = URL.createObjectURL(
    new Blob(["\uFEFF", text], { type: "text/plain;charset=utf-8" })
  );
  const link = document.createElement("a");
  link.href = url;
  link.download = "문장수리국-활동기록.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function resetGame() {
  if (!confirm("저장된 문장과 점수를 지우고 다시 시작할까요?")) return;
  state.step = 0;
  state.done = [];
  state.answers = {};
  caseIndex = 0;
  persist();
  render();
}

render();
</script>
</body>
</html>
